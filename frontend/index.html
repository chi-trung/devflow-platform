<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS ignores the web manifest for Add-to-Home-Screen and only reads this
         tag; without it the pinned tile is a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("devflow.theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Critical paint: the app background is applied inline so the first paint
         is the real theme color, not a white flash while index.css arrives
         inside the JS bundle. The theme script above already set html.light. -->
    <style>
      html {
        background-color: #0a0e14;
      }
      html.light {
        background-color: #f5f7fa;
      }
      body {
        margin: 0;
        background-color: #0a0e14;
        color: #e6edf3;
      }
      html.light body {
        background-color: #f5f7fa;
        color: #16212c;
      }
      /* Branded boot splash — rendered before React mounts, then wiped when
         createRoot().render() replaces #root's children. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0e14;
      }
      html.light #splash {
        background: #f5f7fa;
      }
      #splash-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #1f2a38;
        border-top-color: #2dd4bf;
        animation: df-spin 0.8s linear infinite;
      }
      html.light #splash-spinner {
        border-color: #d4dbe4;
        border-top-color: #0d9488;
      }
      @keyframes df-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <meta
      name="description"
      content="DevFlow — plan sprints, run your kanban board, and ship faster. A project platform for software teams."
    />
    <meta property="og:title" content="DevFlow" />
    <meta
      property="og:description"
      content="Plan sprints, run your kanban board, and ship faster."
    />
    <!-- Absolute URL because crawlers fetch this from the raw HTML, before
         any JS runs. 1400x631 sits above the 1200x630 minimum Facebook and
         Slack want and matches the 1.91:1-ish shape they crop toward. -->
    <meta property="og:image" content="https://devflow-platform-kappa.vercel.app/landing-opt.png" />
    <meta property="og:image:width" content="1400" />
    <meta property="og:image:height" content="631" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevFlow" />
    <!-- Without a card tag Twitter/Slack fall back to a title-only summary,
         which is why shared links previewed as bare text. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://devflow-platform-kappa.vercel.app/landing-opt.png" />
    <link rel="preconnect" href="https://devflow-api-vd5h.onrender.com" />
    <link rel="dns-prefetch" href="https://devflow-api-vd5h.onrender.com" />
    <!-- Fonts are self-hosted same-origin (see @font-face in index.css).
         Preloading the latin subsets here means the web fonts are usually in
         memory before first paint — no cross-origin round-trip mid-load, and
         the font swap no longer shifts text (the old CLS driver). The smaller
         vietnamese subsets load on demand from the stylesheet. -->
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>DevFlow — ship in flow</title>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="Loading DevFlow">
        <div id="splash-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
