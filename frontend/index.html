<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("devflow.theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Critical paint: the app background is applied inline so the first paint
         is the real theme color, not a white flash while index.css arrives
         inside the JS bundle. The theme script above already set html.light. -->
    <style>
      html {
        background-color: #0a0e14;
      }
      html.light {
        background-color: #f5f7fa;
      }
      body {
        margin: 0;
        background-color: #0a0e14;
        color: #e6edf3;
      }
      html.light body {
        background-color: #f5f7fa;
        color: #16212c;
      }
      /* Branded boot splash — rendered before React mounts, then wiped when
         createRoot().render() replaces #root's children. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0e14;
      }
      html.light #splash {
        background: #f5f7fa;
      }
      #splash-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #1f2a38;
        border-top-color: #2dd4bf;
        animation: df-spin 0.8s linear infinite;
      }
      html.light #splash-spinner {
        border-color: #d4dbe4;
        border-top-color: #0d9488;
      }
      @keyframes df-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <meta
      name="description"
      content="DevFlow — plan sprints, run your kanban board, and ship faster. A project platform for software teams."
    />
    <meta property="og:title" content="DevFlow" />
    <meta
      property="og:description"
      content="Plan sprints, run your kanban board, and ship faster."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://devflow-api-vd5h.onrender.com" />
    <link rel="dns-prefetch" href="https://devflow-api-vd5h.onrender.com" />
    <!-- Web fonts load asynchronously: the media="print" trick lets the browser
         paint with system fallback fonts immediately and swaps to Manrope /
         Space Grotesk / JetBrains Mono when the stylesheet arrives, instead of
         holding first paint hostage to a fonts.googleapis.com round-trip. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>DevFlow — ship in flow</title>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="Loading DevFlow">
        <div id="splash-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
