<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Browsers without SVG favicon support (Safari before 16, old Edge)
         skip the SVG and request /favicon.ico, which the SPA rewrite serves
         as HTML. Point the fallback at the real PNG instead. -->
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS ignores the web manifest for Add-to-Home-Screen and only reads this
         tag; without it the pinned tile is a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("devflow.theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Critical paint: the app background is applied inline so the first paint
         is the real theme color, not a white flash while index.css arrives
         inside the JS bundle. The theme script above already set html.light. -->
    <style>
      html {
        background-color: #0a0e14;
      }
      html.light {
        background-color: #f5f7fa;
      }
      body {
        margin: 0;
        background-color: #0a0e14;
        color: #e6edf3;
      }
      html.light body {
        background-color: #f5f7fa;
        color: #16212c;
      }
      /* Branded boot splash — rendered before React mounts, then wiped when
         createRoot().render() replaces #root's children. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0e14;
      }
      html.light #splash {
        background: #f5f7fa;
      }
      #splash-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #1f2a38;
        border-top-color: #2dd4bf;
        animation: df-spin 0.8s linear infinite;
      }
      html.light #splash-spinner {
        border-color: #d4dbe4;
        border-top-color: #0d9488;
      }
      @keyframes df-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <meta
      name="description"
      content="DevFlow — plan sprints, run your kanban board, and ship faster. A project platform for software teams."
    />
    <meta property="og:title" content="DevFlow" />
    <meta
      property="og:description"
      content="Plan sprints, run your kanban board, and ship faster."
    />
    <!-- Absolute URL because crawlers fetch this from the raw HTML, before
         any JS runs. 1400x631 sits above the 1200x630 minimum Facebook and
         Slack want and matches the 1.91:1-ish shape they crop toward. -->
    <meta property="og:image" content="https://devflow-platform-kappa.vercel.app/landing-opt.png" />
    <meta property="og:image:width" content="1400" />
    <meta property="og:image:height" content="631" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevFlow" />
    <!-- Without a card tag Twitter/Slack fall back to a title-only summary,
         which is why shared links previewed as bare text. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://devflow-platform-kappa.vercel.app/landing-opt.png" />
    <link rel="preconnect" href="https://devflow-api-vd5h.onrender.com" />
    <link rel="dns-prefetch" href="https://devflow-api-vd5h.onrender.com" />
    <!-- Fonts are self-hosted same-origin (see @font-face in index.css).
         Preloading the latin subsets here means the web fonts are usually in
         memory before first paint — no cross-origin round-trip mid-load, and
         the font swap no longer shifts text (the old CLS driver). The smaller
         vietnamese subsets load on demand from the stylesheet. -->
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>DevFlow — ship in flow</title>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="Loading DevFlow">
        <div id="splash-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      // Boot watchdog. The route error boundary ships inside the bundle, so
      // it cannot help when the bundle itself never runs (offline mid-load of
      // a stale chunk, blocked script). When React mounts it replaces
      // #splash's contents, so a splash still present after 12s means boot
      // failed. Swap the spinner for a reload prompt instead of spinning
      // forever. Kept inline and dependency-free on purpose: everything it
      // needs is already parsed at this point.
      setTimeout(function () {
        var splash = document.getElementById("splash");
        if (!splash) return;
        // The splash paints #f5f7fa behind html.light, so pick readable
        // text colors per theme instead of hardcoding the dark palette.
        var light = document.documentElement.classList.contains("light");
        splash.innerHTML =
          '<div style="text-align:center;padding:24px;max-width:320px">' +
          '<p style="margin:0;font:600 16px/1.5 system-ui;color:' +
          (light ? "#16212c" : "#e6edf3") +
          '">DevFlow could not start</p>' +
          '<p style="margin:8px 0 0;font:13px/1.5 system-ui;color:' +
          (light ? "#5b6b7d" : "#93a4b8") +
          '">A connection problem stopped the app from loading.</p>' +
          '<button style="margin-top:16px;padding:8px 18px;border-radius:8px;border:1px solid #14b8a6;background:#14b8a6;color:#04211e;font:600 14px system-ui;cursor:pointer" onclick="location.reload()">Try again</button>' +
          "</div>";
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
