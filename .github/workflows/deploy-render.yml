name: Deploy Backend to Render

# Render free tier does NOT auto-deploy on push; a merged backend change
# stays unserved until someone clicks Manual Deploy. This workflow fires
# Render's deploy hook after a push to main that touches backend/API code.
#
# NOTE: `on.push.paths` combined with `branches` silently produces empty
# "failure" runs (0 jobs) instead of filtering — so we accept all pushes to
# main and gate on changed files inside the job instead.
#
# NOTE: `secrets` must NOT be referenced inside `if:` conditions — that makes
# the whole workflow invalid ("workflow file issue", 0 jobs, no logs). Check
# the secret in a shell step via env instead and gate on its output.
#
# Requires the repo secret RENDER_DEPLOY_HOOK — the Deploy Hook URL from
# Render dashboard (service → Settings → Deploy Hook). Without it, the job
# is skipped (manual deploy still works, same as before).

on:
  push:
    branches: [main]
  # Manual escape hatch: "Deploy Backend to Render → Run workflow" fires the
  # hook regardless of what the last commits touched.
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: a push can carry many commits, and the deploy
          # decision must look at the WHOLE range, not just HEAD~1..HEAD.
          # (A 5-commit push whose last commit was frontend-only skipped
          # the hook on 2026-09-09 — backend changes sat undeployed.)
          fetch-depth: 0

      - name: Check for backend changes
        id: changes
        run: |
          BASE="${{ github.event.before }}"
          case "$BASE" in
            ''|0000000000000000000000000000000000000000) BASE="HEAD~1" ;;
          esac
          # Force-deploy via workflow_dispatch skips the file check entirely.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — deploying unconditionally."
            exit 0
          fi
          # If the event SHA isn't the tip (rare), diff up to it explicitly.
          if ! git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          if echo "$CHANGED" | grep -Eq '^(src/|tests/|.*\.sln$|Directory\.|global\.json)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Backend changes detected — will deploy."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes — skipping deploy."
          fi

      - name: Check deploy hook configured
        id: hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire deploy hook
        if: steps.changes.outputs.changed == 'true' && steps.hook.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{}' \
            "$RENDER_DEPLOY_HOOK"

      - name: No backend changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No backend changes in this push — skipping auto-deploy."

      - name: No hook configured
        if: steps.changes.outputs.changed == 'true' && steps.hook.outputs.configured == 'false'
        run: echo "RENDER_DEPLOY_HOOK is not set — skipping auto-deploy. Deploy manually from the Render dashboard."
