name: Database Backup

# Nightly logical backup of the production Postgres (Supabase), dumped with
# a pg_dump new enough for any supported server major (postgres:17 image; the
# runner's apt postgresql-client is older and can hit a version mismatch).
# The dump is uploaded as a private workflow artifact (30-day retention);
# artifact retention IS the pruning mechanism, so there is no KEEP_COUNT.
#
# Requires the repo secret BACKUP_DATABASE_URL — the **Session pooler**
# connection string from Supabase (Connect → Session pooler, port 5432,
# host aws-0-<region>.pooler.supabase.com). Do NOT use the direct
# db.<ref>.supabase.co endpoint: it is IPv6-only and GitHub-hosted runners
# are IPv4-only, so pg_dump cannot reach it. The transaction pooler (port
# 6543) is also unsuitable for pg_dump. Without the secret the job fails
# fast with a clear message instead of silently dumping nothing.

on:
  schedule:
    # Daily at 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Dump production Postgres
    runs-on: ubuntu-latest

    steps:
      - name: Check secret is configured
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [[ -z "$BACKUP_DATABASE_URL" ]]; then
            echo "::error::BACKUP_DATABASE_URL is not set. Add it under repo Settings → Secrets and variables → Actions, using the Session pooler connection string from Supabase (Connect → Session pooler)."
            exit 1
          fi

      - name: Dump production database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p /tmp/devflow-backups
          docker run --rm \
            -v /tmp/devflow-backups:/backups \
            -e DATABASE_URL \
            postgres:17-alpine \
            pg_dump "$DATABASE_URL" \
              --format=custom \
              --compress=6 \
              --file=/backups/backup-$STAMP.dump

          BACKUP="/tmp/devflow-backups/backup-$STAMP.dump"

          # Verify the custom-format archive is readable before uploading
          docker run --rm \
            -v /tmp/devflow-backups:/backups \
            postgres:17-alpine \
            pg_restore --list "/backups/backup-$STAMP.dump" > /dev/null

          echo "Backup created: $(du -h "$BACKUP" | cut -f1) — $BACKUP"
          echo "BACKUP_FILE=$BACKUP" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
