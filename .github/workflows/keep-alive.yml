name: Keep Alive

# Pings the API every 5 minutes so the free-tier Render instance
# doesn't spin down (and the Supabase database stays active).
# NOTE: GitHub often delays/skips scheduled runs under load, so the
# effective interval can still drift longer than the cron value.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            https://devflow-api-vd5h.onrender.com/health)
          echo "Health check returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::API health check returned HTTP $code"
          fi
